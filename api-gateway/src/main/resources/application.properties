spring.application.name=api-gateway
server.port=8080

# Shared JWT signing secret - HARUS identik dengan auth-service dan semua service lain.
jwt.secret=ini-secret-key-jwt-shared-untuk-semua-microservice-minimal-256-bit-panjang

springdoc.swagger-ui.path=/swagger-ui.html

# Backend service base URL, dipakai proxy buat forward request.
routes.auth=http://localhost:8084
routes.customers=http://localhost:8081
routes.products=http://localhost:8082
routes.orders=http://localhost:8083
routes.karyawan=http://localhost:8085
routes.absensi=http://localhost:8085
routes.izin-cuti=http://localhost:8085
