spring.application.name=auth-service
server.port=8084
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# Shared JWT signing secret - MUST be identical across auth-service, api-gateway,
# customer-service, product-service, order-service, employee-service (karyawan).
jwt.secret=ini-secret-key-jwt-shared-untuk-semua-microservice-minimal-256-bit-panjang
jwt.expiration-ms=3600000

# Akun ADMIN pertama, di-seed otomatis pas startup kalau belum ada (lihat AdminSeeder).
admin.default-username=admin
admin.default-password=admin123
